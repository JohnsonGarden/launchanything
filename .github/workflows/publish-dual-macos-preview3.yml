name: Publish macOS arm64 and Intel x86_64 unsigned Preview 3

# Opt-in public developer preview; never a signed Stable Release.
on:
  push:
    branches:
      - 'publish-preview/v0.1.0-preview.3'

permissions:
  contents: read

concurrency:
  group: publish-macos-v0.1.0-preview.3
  cancel-in-progress: false

jobs:
  gate:
    name: Check publishing marker and accepted main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main_sha: ${{ steps.verify.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify one-file opt-in based on main and unused tag
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/publish-preview/v0.1.0-preview.3'
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$(git rev-parse HEAD^)" = "$MAIN_SHA"
          test "$(git rev-list --count "$MAIN_SHA..$GITHUB_SHA")" = 1
          test "$(git diff --name-only "$MAIN_SHA" "$GITHUB_SHA")" = "docs/releases/PUBLISH-v0.1.0-preview.3.md"
          test "$(node -p "require('./package.json').version")" = '0.1.0'
          test "$(node -p "require('./src-tauri/tauri.conf.json').version")" = '0.1.0'
          if gh release view 'v0.1.0-preview.3' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Tag/release v0.1.0-preview.3 already exists; refusing overwrite." >&2
            exit 1
          fi
          tag_status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/ref/tags/v0.1.0-preview.3" || true)"
          test "$tag_status" = 404
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build native ${{ matrix.arch }} installer
    needs: gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            bundle: src-tauri/target/release/bundle
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
            bundle: src-tauri/target/x86_64-apple-darwin/release/bundle
    env:
      LAUNCHANYTHING_MACOS_ARCH: ${{ matrix.arch }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Confirm native CPU and aligned app version
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = "${{ matrix.arch }}"
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./src-tauri/tauri.conf.json').version")"
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: All UI, native, and release regression checks
        shell: bash
        run: |
          set -euo pipefail
          npm run doctor
          npm run test:release-contract
          npm run test:macos-installer
          npm run test:macos-installer-e2e
          npm run typecheck
          npm test
          npm run prepare:macos
          npm run test:macos-launch
          npm run test:rust
          if [ "${{ matrix.arch }}" = x86_64 ]; then npm run test:intel-contract; fi
      - name: Build Tauri production installer
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            npm run build:macos-intel
            npm run verify:macos-intel
          else
            npm run build
          fi
      - name: Validate Mach-O architecture, DMG, and ZIP
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ matrix.bundle }}"
          ARCH="${{ matrix.arch }}"
          APP="$BASE/macos/LaunchAnything.app"
          HELPER="$APP/Contents/Resources/bin/launchanything-macos-helper"
          APP_BIN="$(find "$APP/Contents/MacOS" -maxdepth 1 -type f -print -quit)"
          DMG="$(find "$BASE/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -d "$APP"
          test -n "$APP_BIN"
          test -f "$HELPER"
          test -n "$DMG"
          xcrun lipo "$APP_BIN" -verify_arch "$ARCH"
          xcrun lipo "$HELPER" -verify_arch "$ARCH"
          PREFIX="LaunchAnything_v0.1.0_preview3_macos_${ARCH}_UNSIGNED"
          mkdir -p release-assets
          cp "$DMG" "release-assets/${PREFIX}.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "release-assets/${PREFIX}_app.zip"
          {
            echo "LaunchAnything v0.1.0-preview.3 | $ARCH | UNSIGNED / NOT NOTARIZED"
            echo "Source: https://github.com/$GITHUB_REPOSITORY/commit/${{ needs.gate.outputs.main_sha }}"
            echo "Build: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Not a signed Stable Release."
          } > "release-assets/BUILD_INFO_${ARCH}.txt"
          (cd release-assets && shasum -a 256 *.dmg *.zip > "SHA256SUMS_${ARCH}.txt" && shasum -a 256 -c "SHA256SUMS_${ARCH}.txt")
      - uses: actions/upload-artifact@v4
        with:
          name: launchanything-macos-${{ matrix.arch }}-preview3
          path: release-assets/
          retention-days: 30
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish two-architecture unsigned Pre-release
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.main_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: launchanything-macos-*-preview3
          path: release-assets/
          merge-multiple: true
      - name: Verify both native installer families and combined hashes
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          test -f LaunchAnything_v0.1.0_preview3_macos_arm64_UNSIGNED.dmg
          test -f LaunchAnything_v0.1.0_preview3_macos_arm64_UNSIGNED_app.zip
          test -f LaunchAnything_v0.1.0_preview3_macos_x86_64_UNSIGNED.dmg
          test -f LaunchAnything_v0.1.0_preview3_macos_x86_64_UNSIGNED_app.zip
          test -f BUILD_INFO_arm64.txt
          test -f BUILD_INFO_x86_64.txt
          test -f SHA256SUMS_arm64.txt
          test -f SHA256SUMS_x86_64.txt
          shasum -a 256 -c SHA256SUMS_arm64.txt
          shasum -a 256 -c SHA256SUMS_x86_64.txt
          sha256sum *.dmg *.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Ensure accepted main is unchanged
        shell: bash
        run: |
          set -euo pipefail
          CURRENT="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$CURRENT" = "${{ needs.gate.outputs.main_sha }}"
          ! gh release view v0.1.0-preview.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
      - name: Publish public GitHub Pre-release, never stable
        shell: bash
        run: |
          set -euo pipefail
          gh release create v0.1.0-preview.3 release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.gate.outputs.main_sha }}" \
            --prerelease \
            --latest=false \
            --title 'LaunchAnything v0.1.0 Preview 3 — macOS Apple Silicon + Intel (UNSIGNED)' \
            --notes-file docs/releases/public-preview-v0.1.0-preview3.md
          gh release view v0.1.0-preview.3 --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets,url
