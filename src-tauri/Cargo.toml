[package]
name = "launchanything"
version = "0.1.1-preview.1"
description = "A focused per-app proxy launcher for macOS"
authors = ["JohnsonGarden contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "launchanything_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-updater = "2"
semver = "1"
reqwest = { version = "0.13", features = ["json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
