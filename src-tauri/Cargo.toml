[package]
name = "launchanything"
version = "0.1.0"
description = "A focused per-app proxy launcher for macOS"
authors = ["JohnsonGarden contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "launchanything_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.8.0", features = [] }

[dependencies]
tauri = { version = "=2.8.0", features = [] }
tauri-plugin-dialog = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
