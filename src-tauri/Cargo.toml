[package]
name = "launchanything"
version = "0.1.0"
description = "A focused per-app proxy launcher for macOS"
authors = ["JohnsonGarden contributors"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "launchanything_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.8.5", features = [] }
tauri-plugin-dialog = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
